<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="data:;," type="image/x-icon">
    <title>Simple Game I suppose</title>
    <script type="module" src="/script.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            min-height: 100vh;
            height: 100%;
        }

        .body {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
        }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
    }
    </style>
</head>
<body class="body">
    <form action="/api/leaderboard" method="post" id="username-entry" style="background-color: gray; z-index: 999; position: absolute; top: 50%; left: 50%; padding: 20px;">
        <input type="text" name="username" placeholder="Username Here:">
        <input type="submit" value="Confirm">
    </form>
    <div style="display: flex; gap: 5px;">
        <p id="health">Health:</p>
        <p id="bullets">Bullets:</p>
        <p id="wave">Wave:</p>
        <p id="username">Username: ERR</p>
    </div>
    <canvas id="gameScreen"></canvas>
    <div id="gameOver" style="background-color: red; z-index: 999; display: none; position: absolute; top: 50%; left: 50%; flex-direction: column;">
        <p>Game Over</p>
        <p id="processed-game-over"></p>
    </div>
</body>
</html>
